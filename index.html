<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Space+Grotesk:wght@600;700;800&family=Unbounded:wght@700;800;900&display=swap" rel="stylesheet" />
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5984128562562799"
     crossorigin="anonymous"></script>

    <title>Kuro Shelf – Anime & Manga Discovery and Tracking</title>
    <meta name="description" content="Discover, track, and rank your favorite anime and manga with real-time seasonal schedules, community reviews, and custom shelves on Kuro Shelf." />
    <meta name="keywords" content="anime, manga, anime rankings, anime schedule, seasonal anime, kuro shelf, kuroshelf, tracking" />
    <meta name="google-site-verification" content="googled3ee4442d0a63b40" />
    
    <!-- OpenGraph Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kuro Shelf – Anime & Manga Discovery and Tracking" />
    <meta property="og:description" content="Discover, track, and rank your favorite anime and manga with real-time seasonal schedules and custom shelves." />
    <meta property="og:site_name" content="Kuro Shelf" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kuro Shelf – Anime & Manga Discovery" />
    <meta name="twitter:description" content="Discover, track, and rank your favorite anime and manga with real-time seasonal schedules and custom shelves." />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Kuro Shelf",
      "alternateName": "KuroShelf",
      "applicationCategory": "EntertainmentApplication",
      "operatingSystem": "All",
      "description": "Anime and manga discovery, tracking, and community platform.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
    <script>
      // Gracefully prevent unhandled WebSocket closure errors when HMR is inactive
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = reason ? (reason.message || String(reason)) : '';
        if (msg.indexOf('WebSocket') !== -1) {
          event.preventDefault();
        }
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-[var(--color-bg-base)] text-[var(--color-text-main)] font-sans antialiased min-h-screen transition-colors duration-200 selection:bg-rose-500/30 selection:text-rose-500">
